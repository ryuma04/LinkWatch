[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkwatch"
version = "0.3.1"
description = "A small CLI link and uptime checker with an HTML status page"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0.0",
    "requests>=2.33.0,<3.0.0",
    "jinja2>=3.1.6,<4.0",
    "pydantic>=2.0.0,<3.0.0",
    "click>=7",
    "chardet>=7.6.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "rich",
    "certifi>=2026.7.22",
]

[project.scripts]
linkwatch = "linkwatch.cli:cli"

[tool.setuptools]
packages = ["linkwatch"]

[tool.setuptools.package-data]
linkwatch = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
